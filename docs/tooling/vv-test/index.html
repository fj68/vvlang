<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vv test - vvlang documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        h1,
        h2,
        h3 {
            color: var(--heading-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--heading-color);
        }

        nav.langs a {
            color: var(--muted-text);
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.9rem;
        }

        nav.langs a.active {
            color: var(--heading-color);
            font-weight: bold;
            text-decoration: underline;
        }

        main {
            padding: 0;
        }

        code {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
        }

        pre {
            background-color: var(--pre-bg);
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border: none;
        }

        th {
            background: var(--toc-bg);
            color: var(--heading-color);
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="../../static/highlight.css">
</head>

<body>
    <header>
        <div class='logo'><a href='../../index.html'>vvlang docs</a></div>
        <nav class='langs'>
            <a href='#' class='active'>en</a>
            <a href='#'>ja</a>
        </nav>
    </header>
    <main>
        <p><a href='../index.html'>&larr; Back to the index</a></p>
        <div class="command-header">
            <h1>vv test</h1>
            <p>Runs tests in the specified directory or file. If no path is provided, it defaults to the current
                directory. It recursively searches for <code>.vv</code> files and executes <code>test</code> blocks.</p>
        </div>
        <pre><code>vv test
vv test ./tests/my_test.vv</code></pre>
    </main>
    <script type="module" src="../../static/highlight.js"></script>
</body>

</html>
