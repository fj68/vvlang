<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vv test - vv Language Reference</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: #333;
        }

        h1,
        h2,
        h3 {
            color: #2c3e50;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        code {
            background-color: #f8f9fa;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
        }

        pre {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
        }

        pre code {
            background-color: transparent;
            padding: 0;
        }

        .command {
            border-left: 4px solid #3498db;
            padding-left: 1rem;
            margin-bottom: 2rem;
        }
    </style>
    <link rel="stylesheet" href="../../static/highlight.css">
</head>

<body>
    <p><a href="../index.html">← Back to Tooling</a></p>
    <h1>vv test</h1>
    <div class="command">
        <p>Runs tests in the specified directory or file. If no path is provided, it defaults to the current directory.
            It recursively searches for <code>.vv</code> files and executes <code>test</code> blocks.</p>
        <pre><code>vv test
vv test ./tests/my_test.vv</code></pre>
    </div>
    <script type="module" src="../../static/highlight.js"></script>
</body>
