{{define "layout"}}
<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>{{template "title" .}} - vvlang documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: #333;
        }

        h1,
        h2,
        h3 {
            color: #2c3e50;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        header .logo a {
            color: #2c3e50;
            text-decoration: none;
        }

        header .logo a:hover {
            text-decoration: underline;
        }

        nav.langs a {
            color: #666;
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.9rem;
        }

        nav.langs a.active {
            color: #2c3e50;
            font-weight: bold;
            text-decoration: underline;
        }

        main {
            padding: 0;
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            color: #2c3e50;
            margin-top: 2rem;
        }

        .docstring {
            padding: 1rem;
            margin: 1rem 0;
        }



        .export-item {
            margin-bottom: 2rem;
        }

        .signature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3498db;
            padding-left: 1rem;
            margin-bottom: 0.5rem;
        }

        .extern-tag {
            font-size: 0.8rem;
            color: #666;
            font-weight: normal;
            font-family: monospace;
            background: #eee;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
        }

        h3 {
            margin-bottom: 0.5rem;
        }

        pre {
            background: #ffffff;
            color: #333;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid #eee;
        }

        code {
            font-family: monospace;
            background-color: #ffffff;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            border: 1px solid #eee;
        }

        h3 code {
            background-color: transparent;
            padding: 0;
            border: none;
        }

        pre code {
            padding: 0;
            border: none;
            background-color: transparent;
        }

        .toc {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin: 2rem 0;
            border: 1px solid #eee;
        }

        .toc h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .toc ul {
            list-style: none;
            padding-left: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }

        .toc li a {
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
    <link rel="stylesheet" href="{{.RootRel}}static/highlight.css">
</head>

<body>
    <header>
        <div class='logo'><a href='{{.RootRel}}{{.CurrentLang}}/index.html'>vvlang docs</a></div>
        <nav class='langs'>
            {{range .AllLangs}}
            <a href='{{$.RootRel}}{{.}}/index.html' {{if eq . $.CurrentLang}}class='active' {{end}}>{{.}}</a>
            {{end}}
        </nav>
    </header>
    <main>
        {{template "content" .}}
    </main>
    <script type="module" src="{{.RootRel}}static/highlight.js"></script>
</body>

</html>
{{end}}
